name: MIGRATE-01 local HTTP truth v5
on:
  push:
    branches: [feat/tanstack-migration]
    paths: [.github/workflows/migrate01-http.yml]
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tanstack-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Build Nitro server
        run: npm run build
      - name: Inspect generated Worker config
        run: |
          cat .output/server/wrangler.json
          find .output/public -maxdepth 2 -type f | sort | head -100
      - name: Start local Nitro
        run: |
          cp .env .output/server/.dev.vars
          npx --yes wrangler@4.168.0 dev --config .output/server/wrangler.json --no-bundle --ip 127.0.0.1 --port 3000 >/tmp/marketrends-nitro.log 2>&1 &
          echo $! >/tmp/marketrends-nitro.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marketrends-nitro.log
          exit 1
      - name: Raw response diagnostics
        run: |
          for path in / /__seo_nonexistent_20261122 /cluster/ai /admin; do
            echo "===== $path ====="
            curl -sS -D - "http://127.0.0.1:3000$path" -o /tmp/body.html | head -30
            head -c 1200 /tmp/body.html
            echo
          done
      - name: AUDIT-01 local HTTP matrix
        env:
          MARKETRENDS_AUDIT_ORIGIN: http://127.0.0.1:3000
        run: node scripts/seo-http-audit.mjs
      - name: Valid sitemap route parity
        env:
          MARKETRENDS_AUDIT_ORIGIN: http://127.0.0.1:3000
        run: node scripts/ssr-http-parity.mjs
      - name: Preserve server log on failure
        if: failure()
        run: cat /tmp/marketrends-nitro.log || true
      - name: Stop local Nitro
        if: always()
        run: |
          test -f /tmp/marketrends-nitro.pid && kill $(cat /tmp/marketrends-nitro.pid) || true
