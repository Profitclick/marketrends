name: Read-only production SEO HTTP audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-http-audit.yml'
      - 'scripts/seo-http-audit.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe public initial HTTP responses (read-only)
        run: node scripts/seo-http-audit.mjs
      - name: Attach audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-http-audit
          path: seo-audit/
          if-no-files-found: warn
          retention-days: 14
