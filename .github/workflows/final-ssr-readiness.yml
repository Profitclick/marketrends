name: Final SSR readiness – isolated
on:
  push:
    branches: [diagnostics/final-ssr-readiness]
permissions:
  contents: read
concurrency:
  group: marketrends-isolated-release-readiness
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.node.json --noEmit
      - name: Deterministic tests
        run: |
          find scripts -maxdepth 1 \( -name '*.test.ts' -o -name '*.test.mjs' -o -name '*.test.js' \) ! -name 'production-access.test.ts' -print0 | xargs -0 bun test
      - name: Build
        run: npm run build
      - name: Package exact build before runtime credentials are copied
        run: |
          mkdir -p release-evidence
          test -f .output/server/wrangler.json
          test -f .output/public/sitemap-index.xml
          test -z "$(find .output -name '.dev.vars' -o -name '.env')"
          git rev-parse HEAD > release-evidence/revision.txt
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf release-evidence/ssr-build.tar.gz .output
          (cd release-evidence && sha256sum ssr-build.tar.gz > SHA256SUMS)
      - name: Start isolated SSR
        run: |
          cp .env .output/server/.dev.vars
          npx --yes wrangler@4.168.0 dev --config .output/server/wrangler.json --no-bundle --ip 127.0.0.1 --port 3000 >/tmp/marketrends-nitro.log 2>&1 &
          echo $! >/tmp/marketrends-nitro.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: HTTP audit
        env:
          MARKETRENDS_AUDIT_ORIGIN: http://127.0.0.1:3000
        run: node scripts/seo-http-audit.mjs
      - name: Sitemap representative parity
        env:
          MARKETRENDS_AUDIT_ORIGIN: http://127.0.0.1:3000
        run: node scripts/ssr-http-parity.mjs | tee release-evidence/parity.log
      - name: Browser regression
        env:
          MARKETRENDS_AUDIT_ORIGIN: http://127.0.0.1:3000
        run: |
          mkdir -p /tmp/marketrends-browser
          npm install --prefix /tmp/marketrends-browser --no-audit --no-fund playwright@1.56.1
          /tmp/marketrends-browser/node_modules/.bin/playwright install --with-deps chromium
          cp scripts/migrate02-browser.mjs /tmp/marketrends-browser/test.mjs
          node /tmp/marketrends-browser/test.mjs | tee release-evidence/browser.json
          cp scripts/migrate02-auth-browser.mjs /tmp/marketrends-browser/auth.mjs
          node --env-file=.env /tmp/marketrends-browser/auth.mjs | tee release-evidence/auth.json
      - name: Upload candidate and test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marketrends-ssr-release-candidate
          path: |
            release-evidence/
            seo-audit/http-audit.json
            seo-audit/http-audit.md
          if-no-files-found: error
          retention-days: 30
      - name: Stop isolated server
        if: always()
        run: |
          test -f /tmp/marketrends-nitro.pid && kill "$(cat /tmp/marketrends-nitro.pid)" || true
