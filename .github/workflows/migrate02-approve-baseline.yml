name: MIGRATE-02 offline approval of the 3,720-URL baseline
on:
  push:
    branches: [diagnostics/migrate02-3a7-4-1]
    paths: [.github/workflows/migrate02-approve-baseline.yml]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    if: >-
      github.repository == 'Profitclick/marketrends' &&
      github.event.before == 'b4df94f77bd07529b63a3af8d2a3a831f8a02d72' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: guard-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 091837a1a5b1ed2be2c41fcba2d6032f2dfc3395
          path: recovery-src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned Actions evidence and terminal quarantine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          get() {
            local id="$1" run="$2" head="$3" digest="$4" conclusion="$5" destination="$6"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" |
              jq -e --arg id "$id" --arg run "$run" --arg head "$head" --arg digest "$digest"                 '(.id|tostring)==$id and .expired==false and .digest==("sha256:"+$digest) and (.workflow_run.id|tostring)==$run and .workflow_run.head_sha==$head' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
              jq -e --arg head "$head" --arg conclusion "$conclusion"                 '.status=="completed" and .conclusion==$conclusion and .run_attempt==1 and .head_sha==$head' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$destination"
          }
          get 15086417171 45752542669 bfa6bd8400500a70cb13f2f464bf8dfc47193922 39c14deb104911c8b67e98b5bb49b1e62fb7b84a6001a56cf2e9b7038a34fb8d success "$RUNNER_TEMP/source.zip"
          get 15086509707 45753332362 f853e6e91c538a14c76991110e6c3a09d7972b06 136d0e76d49ae9f6285961931ab1b9f8c25cbfbb9a60968815bccdf2c90c4619 failure "$RUNNER_TEMP/quarantine.zip"
          ref=refs/heads/diagnostics/migrate02-register/156e0405b7b92e16e1c028b1962bd1e708aade889c7f1190f89873730efed024
          terminal=725bc76e96b8bf5773c2e81de1d9c6277d0de758
          test "$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "$ref" | cut -f1)" = "$terminal"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$terminal" |
            jq -e --arg key "${ref##*/}" '(.message|split("\n")[0]|fromjson) | .status=="QUARANTINE" and .key==$key and .runId=="45753332362" and .sourceId=="15086417171" and .limit==250' >/dev/null
      - name: Build the approved baseline offline
        working-directory: recovery-src
        run: |
          set -euo pipefail
          node ../guard-src/scripts/approve-segment-baseline.mjs "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/quarantine.zip" "$RUNNER_TEMP/approved-baseline" --vekttap --approved
          test -z "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/diagnostics/migrate02-register/a30ec0487ecac36e2d45561ea72ba944cef93a3866eeafd244b55aca97d0e5de)"
      - uses: actions/upload-artifact@v4
        with:
          name: migrate02-approved-baseline-3720
          path: ${{ runner.temp }}/approved-baseline/
          if-no-files-found: error
          retention-days: 30
